<h2>Photos tab — layout preview</h2>
<p class="subtitle">Masonry grid with upload button. Tap any photo to open the action sheet.</p>

<div class="mockup">
  <div class="mockup-header">PhotosTab — Nyx</div>
  <div class="mockup-body" style="padding:12px;background:#121212;border-radius:0 0 8px 8px;font-size:12px">

    <!-- Upload button row -->
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button style="display:flex;align-items:center;gap:6px;padding:7px 14px;background:none;border:1px solid #b400ff;border-radius:8px;color:#b400ff;font-size:11px;cursor:pointer">
        <span style="font-size:14px">+</span> Add photo
      </button>
    </div>

    <!-- Masonry grid (2 columns) -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      <!-- Col 1 -->
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="background:repeating-linear-gradient(135deg,#2a1a3e 0px,#1a2a3e 30px,#0a2e1a 60px);border-radius:6px;height:90px;cursor:pointer"></div>
        <div style="background:repeating-linear-gradient(45deg,#1a2a0e 0px,#2a0a3e 25px,#3e2a0a 50px);border-radius:6px;height:60px;cursor:pointer"></div>
        <div style="background:repeating-linear-gradient(90deg,#0a1a2e 0px,#2e1a0a 40px,#1a2e0a 80px);border-radius:6px;height:110px;cursor:pointer"></div>
      </div>
      <!-- Col 2 -->
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="background:repeating-linear-gradient(160deg,#3e0a1a 0px,#0a3e2a 35px,#1a0a3e 70px);border-radius:6px;height:70px;cursor:pointer"></div>
        <div style="background:repeating-linear-gradient(200deg,#1a3e0a 0px,#3e1a2a 30px,#0a2a3e 60px);border-radius:6px;height:100px;cursor:pointer"></div>
        <div style="background:repeating-linear-gradient(120deg,#2e2a0a 0px,#0a2e1a 45px,#2a0a2e 90px);border-radius:6px;height:80px;cursor:pointer"></div>
      </div>
    </div>

    <!-- Empty state (shown when no photos) -->
    <div style="margin-top:20px;padding:20px;border:1px dashed #2a2a2a;border-radius:8px;text-align:center;color:#555;font-size:11px">
      <div style="font-size:22px;margin-bottom:6px">🖼</div>
      No photos yet — add some above
    </div>

    <!-- Bottom sheet (simulated, overlaid) -->
    <div style="margin-top:16px;background:#1e1e1e;border-radius:12px;padding:14px;border:1px solid #2a2a2a">
      <div style="color:#666;font-size:9px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Photo options (sheet opens on tap)</div>
      <div style="width:100%;height:80px;background:repeating-linear-gradient(135deg,#2a1a3e 0px,#1a2a3e 30px,#0a2e1a 60px);border-radius:6px;margin-bottom:10px"></div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;padding:8px;background:#b400ff22;border:1px solid #b400ff44;border-radius:8px;text-align:center;color:#b400ff;font-size:10px">Set as background</div>
        <div style="padding:8px 14px;background:#f8717122;border:1px solid #f87171;border-radius:8px;color:#f87171;font-size:10px">Delete</div>
      </div>
    </div>

  </div>
</div>
